<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國中 公式整理</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --border: #e3e1db;
    --text: #1f1f1d;
    --muted: #6f6d66;
    --math: #1d7a5c;
    --math-tint: #e3f3ec;
    --phy: #2c6cb0;
    --phy-tint: #e5eff9;
    --byline: #7b3fbf;
    --eng: #c0562b;
    --eng-tint: #fbebe3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121314;
      --card: #1b1d1f;
      --border: #2e3033;
      --text: #ecebe6;
      --muted: #9a9890;
      --math: #4cc79a;
      --math-tint: #16302a;
      --phy: #6aa8eb;
      --phy-tint: #172738;
      --byline: #b993ef;
      --eng: #f0946a;
      --eng-tint: #3a2219;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    line-height: 1.6;
    padding: 40px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header { margin-bottom: 36px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
  .byline { font-size: 0.8em; color: var(--byline); margin-left: 0.4em; white-space: nowrap; }
  .lead { color: var(--muted); font-size: 15px; margin-top: 4px; }

  section { margin-bottom: 40px; }
  h2 {
    font-size: 19px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  h2::before {
    content: ""; width: 4px; height: 20px; border-radius: 2px;
    background: var(--accent);
  }
  .math { --accent: var(--math); --tint: var(--math-tint); }
  .phy  { --accent: var(--phy);  --tint: var(--phy-tint); }
  .eng  { --accent: var(--eng);  --tint: var(--eng-tint); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  a.card {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 16px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tag {
    align-self: flex-start;
    font-size: 12px; font-weight: 600;
    color: var(--accent); background: var(--tint);
    padding: 2px 9px; border-radius: 999px;
  }
  .card-title { font-size: 17px; font-weight: 600; }
  .card-desc  { font-size: 14px; color: var(--muted); }

  .empty {
    color: var(--muted); font-size: 14px;
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 18px; text-align: center;
  }

  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
  .nav { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 600;
         color: var(--byline); text-decoration: none; border: 1px solid var(--border);
         border-radius: 999px; padding: 4px 14px; background: var(--card); }
  .nav:hover { border-color: var(--byline); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>國中 公式整理<span class="byline">Scott老師編輯修訂</span></h1>
    <p class="lead">點選卡片開啟教材</p>
    <a class="nav" href="../">← 回高中教材首頁</a>
  </header>

  <!-- ===================== 數學（國中） ===================== -->
  <section class="math">
    <h2>數學</h2>
    <div class="grid">

      <!-- 新增教材：複製下面一整個 <a class="card"> … </a>，改 href、標籤、標題、說明 -->
      <a class="card" href="math/gcd-lcm.html">
        <span class="tag">因數與倍數</span>
        <span class="card-title">公因數往下拆，公倍數往上疊</span>
        <span class="card-desc">最大公因數與最小公倍數：緞帶、青蛙跳、磁磚、質因數圈圈、短除法五種看法，附拆或疊判斷練習</span>
      </a>

    </div>
  </section>

</div>
</body>
</html>
