<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極座標互動學習</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111214;
    --surface: #1a1c1f;
    --border: rgba(255,255,255,0.08);
    --text: #f0ede8;
    --muted: #888680;
    --teal: #1D9E75;
    --amber: #EF9F27;
    --blue: #378ADD;
    --neon: #39ff7e;
  }

  html {
    zoom: 1.4;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 16px;
    gap: 0;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text);
    text-align: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  /* ── main row ── */
  #main-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 14px;
    flex: 1;
  }

  /* LEFT: canvas 70% */
  #canvas-col {
    flex: 7;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-width: 0;
  }

  #pc-canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
    border-radius: 12px;
    background: #141618;
    border: 1px solid var(--border);
    max-width: 100%;
    max-height: 100%;
  }

  /* RIGHT: panel 30% */
  #panel-col {
    flex: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 10px;
    min-width: 0;
  }

  /* buttons */
  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .pc-btn {
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-align: center;
  }
  .pc-btn.active { background: var(--teal); border-color: var(--teal); color: #fff; }
  .pc-btn:hover:not(.active) { background: rgba(255,255,255,0.07); }

  #mode-label {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: -4px;
  }

  /* divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 2px 0;
  }

  /* info cards — stacked vertically */
  .info-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .card-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .card-value { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .card-sub   { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #sub-quad   { font-size: 16px; font-weight: 600; color: var(--neon); margin-top: 3px; }

  /* notation */
  #cartesian-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
  }
  .cart-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    flex-wrap: wrap;
    min-height: 2em;
    line-height: 1.4;
  }
  .cart-lbl {
    font-size: 15px;
    color: var(--muted);
    font-weight: 500;
    min-width: 28px;
    text-align: right;
  }
  .ax-label {
    position: absolute;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    pointer-events: none;
    white-space: nowrap;
    line-height: 1;
  }
  .ax-label .katex { color: #fff; font-size: 20px !important; }
  .katex { color: var(--text); font-size: 1em !important; }
  #cartesian-formula {
    font-size: 10px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  #notation-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
  }

  #hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  #hint span { color: var(--teal); font-weight: 600; }
</style>
</head>
<body>

<h1>極座標互動學習</h1>

<div id="main-row">

  <!-- LEFT: canvas -->
  <div id="canvas-col">
    <div id="canvas-wrap" style="position:relative;display:inline-block;">
      <canvas id="pc-canvas"></canvas>
      <!-- axis labels overlay (rad mode uses KaTeX) -->
      <div id="ax-right"  class="ax-label" style="right:0;top:50%;transform:translateY(-50%)"></div>
      <div id="ax-top"    class="ax-label" style="top:0;left:50%;transform:translateX(-50%)"></div>
      <div id="ax-left"   class="ax-label" style="left:0;top:50%;transform:translateY(-50%)"></div>
      <div id="ax-bottom" class="ax-label" style="bottom:0;left:50%;transform:translateX(-50%)"></div>
    </div>
  </div>

  <!-- RIGHT: controls -->
  <div id="panel-col">

    <div class="btn-row">
      <button class="pc-btn active" id="btn-deg">角度制（度）</button>
      <button class="pc-btn" id="btn-rad">弳度制（rad）</button>
      <button class="pc-btn" id="btn-neg">負角顯示</button>
    </div>
    <div id="mode-label">目前：正角（逆時針為正）</div>

    <div class="divider"></div>

    <div class="info-stack">
      <div class="card">
        <div class="card-label">半徑 r</div>
        <input type="number" id="input-r" value="3" min="0.1" step="0.1"
          style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.2);
          color:#f0ede8;font-size:20px;font-weight:600;text-align:center;padding:2px 0;outline:none;
          font-family:inherit;margin:4px 0 2px;" />
        <div class="card-sub">可輸入任意值</div>
      </div>
      <div class="card">
        <div class="card-label">角度 θ</div>
        <!-- KaTeX preview (shown when not editing) -->
        <div id="theta-display" style="font-size:20px;font-weight:600;min-height:1.8em;
          display:flex;align-items:center;justify-content:center;cursor:text;padding:2px 0;
          margin:4px 0 2px;" title="點擊編輯"></div>
        <!-- raw input (shown when editing) -->
        <input type="text" id="input-theta" value="30"
          style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.2);
          color:#f0ede8;font-size:20px;font-weight:600;text-align:center;padding:2px 0;outline:none;
          font-family:inherit;margin:4px 0 2px;display:none;" />
        <div class="card-sub" id="sub-theta">由正 x 軸量起（度）</div>
      </div>
      <div class="card">
        <div class="card-label">所在象限</div>
        <div class="card-value" id="val-quad">—</div>
        <div id="sub-quad">—</div>
      </div>
    </div>


    <div id="cartesian-box">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase;">直角座標 (x, y)</div>
      <div class="cart-row">(<span id="val-x">—</span>,&nbsp;<span id="val-y">—</span>)</div>
      <div id="cartesian-formula">x = r cosθ &nbsp;|&nbsp; y = r sinθ</div>
    </div>
    <div id="notation-box">極座標：(<span id="val-r-display">—</span>,&nbsp;<span id="val-notation">—</span>)</div>
    <div id="hint">拖動 <span>●</span> 圓點，觀察角度與象限的變化</div>

  </div><!-- /panel-col -->
</div><!-- /main-row -->

<script>
(function(){
  const canvas = document.getElementById('pc-canvas');
  const ctx    = canvas.getContext('2d');
  const DPR    = window.devicePixelRatio || 1;

  function initCanvas() {
    const col    = document.getElementById('canvas-col');
    const avail  = Math.min(col.clientWidth, col.clientHeight, 700);
    const SIZE   = Math.max(avail, 280);
    canvas.style.width  = SIZE + 'px';
    canvas.style.height = SIZE + 'px';
    canvas.width  = SIZE * DPR;
    canvas.height = SIZE * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    return SIZE;
  }

  let SIZE = initCanvas();
  let CX = SIZE/2, CY = SIZE/2, R = SIZE * 0.34;
  let showDeg = true, showNeg = false, angleRad = Math.PI/6, dragging = false;

  function getR() {
    const v = parseFloat(document.getElementById('input-r').value);
    return isNaN(v) || v <= 0 ? 3 : v;
  }

  document.getElementById('input-r').addEventListener('input', draw);

  // Parse degree input (plain number) or radian input (fraction like "1/2" meaning π/2, or plain number)
  function parseThetaInput(raw) {
    const s = raw.trim();
    if (s === '') return null;
    if (showDeg) {
      const v = parseFloat(s);
      return isNaN(v) ? null : v * Math.PI / 180;
    } else {
      // Accept "p/q" → (p/q)π, or plain number → that many radians
      const fracMatch = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);
      if (fracMatch) {
        const p = parseFloat(fracMatch[1]), q = parseFloat(fracMatch[2]);
        return q !== 0 ? (p / q) * Math.PI : null;
      }
      const v = parseFloat(s);
      return isNaN(v) ? null : v * Math.PI;
    }
  }

  // Convert rad value back to "p/q" string for the input field (rad mode)
  function radToFracStr(rad) {
    const piMultiple = rad / Math.PI;
    const tol = 1e-6;
    for (let q = 1; q <= 24; q++) {
      const pRaw = piMultiple * q;
      const p = Math.round(pRaw);
      if (p !== 0 && Math.abs(pRaw - p) < tol) {
        const g = gcdInt(Math.abs(p), q);
        return `${p/g}/${q/g}`;
      }
    }
    // fallback: plain decimal multiple of π (4 sig figs)
    return parseFloat(piMultiple.toPrecision(4)).toString();
  }

  function gcdInt(a, b) { while (b) { [a,b] = [b, a%b]; } return a; }

  // Convert "p/q" raw string → LaTeX for θ display
  function fracToLatex(raw) {
    const s = raw.trim();
    if (!showDeg) {
      const fracMatch = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
      if (fracMatch) {
        const p = fracMatch[1], q = fracMatch[2];
        // e.g. 1/3 → \dfrac{\pi}{3}, 2/3 → \dfrac{2\pi}{3}, -1/6 → -\dfrac{\pi}{6}
        const pNum = parseFloat(p), qNum = parseFloat(q);
        const neg = pNum < 0 ? '-' : '';
        const absP = Math.abs(pNum);
        const numStr = absP === 1 ? '\\pi' : `${absP}\\pi`;
        return `${neg}\\dfrac{${numStr}}{${qNum}}`;
      }
      // plain number like "2" → 2π
      const v = parseFloat(s);
      if (!isNaN(v)) {
        if (v === 0) return '0';
        if (v === 1) return '\\pi';
        if (v === -1) return '-\\pi';
        return `${v}\\pi`;
      }
      return s; // fallback plain text
    } else {
      // degree mode: plain number + °
      const v = parseFloat(s);
      return isNaN(v) ? s : `${v}°`;
    }
  }

  // Render KaTeX into #theta-display and hide/show input accordingly
  function renderThetaDisplay(rawValue) {
    const latex = fracToLatex(rawValue || document.getElementById('input-theta').value);
    const el = document.getElementById('theta-display');
    try {
      katex.render(latex, el, { throwOnError: false, displayMode: false });
    } catch(e) {
      el.textContent = rawValue;
    }
  }

  const inputTheta = document.getElementById('input-theta');
  const thetaDisplay = document.getElementById('theta-display');

  // Click preview → show input for editing
  thetaDisplay.addEventListener('click', () => {
    thetaDisplay.style.display = 'none';
    inputTheta.style.display = '';
    inputTheta.focus();
    inputTheta.select();
  });

  // While typing → update angle + redraw
  inputTheta.addEventListener('input', () => {
    const rad = parseThetaInput(inputTheta.value);
    if (rad !== null) {
      angleRad = rad;
      if (!showNeg) while (angleRad < 0) angleRad += 2*Math.PI;
    }
    draw();
  });

  // On blur → hide input, show KaTeX preview
  inputTheta.addEventListener('blur', () => {
    inputTheta.style.display = 'none';
    thetaDisplay.style.display = '';
    renderThetaDisplay(inputTheta.value);
  });

  // Enter key → commit
  inputTheta.addEventListener('keydown', e => {
    if (e.key === 'Enter') inputTheta.blur();
  });

  function resize() {
    SIZE = initCanvas();
    CX = SIZE/2; CY = SIZE/2; R = SIZE * 0.34;
    draw();
  }
  window.addEventListener('resize', resize);

  document.getElementById('btn-deg').addEventListener('click', () => {
    showDeg = true;
    document.getElementById('btn-deg').classList.add('active');
    document.getElementById('btn-rad').classList.remove('active');
    const td = getTheta();
    const rawVal = String(Math.round(td * 180 / Math.PI * 10) / 10);
    inputTheta.value = rawVal;
    inputTheta.style.display = 'none';
    thetaDisplay.style.display = '';
    inputTheta.placeholder = '如：30';
    draw();
  });
  document.getElementById('btn-rad').addEventListener('click', () => {
    showDeg = false;
    document.getElementById('btn-rad').classList.add('active');
    document.getElementById('btn-deg').classList.remove('active');
    const td = getTheta();
    const rawVal = radToFracStr(td);
    inputTheta.value = rawVal;
    inputTheta.style.display = 'none';
    thetaDisplay.style.display = '';
    inputTheta.placeholder = '如：1/3 表示π/3';
    draw();
  });
  document.getElementById('btn-neg').addEventListener('click', () => {
    showNeg = !showNeg;
    document.getElementById('btn-neg').classList.toggle('active', showNeg);
    document.getElementById('mode-label').textContent = showNeg
      ? '目前：負角（順時針為負）' : '目前：正角（逆時針為正）';
    draw();
  });

  function getTheta() {
    let a = angleRad;
    if (showNeg) { if (a > Math.PI) a -= 2*Math.PI; else if (a < -Math.PI) a += 2*Math.PI; }
    else { while (a < 0) a += 2*Math.PI; while (a >= 2*Math.PI) a -= 2*Math.PI; }
    return a;
  }

  function getQuadrant(theta) {
    let a = theta;
    while (a < 0) a += 2*Math.PI;
    while (a >= 2*Math.PI) a -= 2*Math.PI;
    if (a < Math.PI/2)   return ['第一象限','x > 0,  y > 0'];
    if (a < Math.PI)     return ['第二象限','x < 0,  y > 0'];
    if (a < 3*Math.PI/2) return ['第三象限','x < 0,  y < 0'];
    return ['第四象限','x > 0,  y < 0'];
  }

  function fmt(a) {
    if (showDeg) return (Math.round(a * 180 / Math.PI * 10) / 10) + '°';
    const pi = a / Math.PI, frac = toFrac(pi);
    return frac ? frac + 'π' : (Math.round(a * 1000) / 1000) + ' rad';
  }

  function toFrac(x) {
    for (let d of [1,2,3,4,6,8,12]) {
      const n = Math.round(x * d);
      if (Math.abs(x - n/d) < 0.015) {
        if (n === 0) return '0';
        return d === 1 ? '' + n : n + '/' + d;
      }
    }
    return null;
  }

  function renderAxLabel(id, latex) {
    const el = document.getElementById(id);
    try { katex.render(latex, el, { throwOnError: false, displayMode: false }); }
    catch(e) { el.textContent = latex; }
  }

  function updateAxisLabels() {
    if (showDeg) {
      document.getElementById('ax-right').textContent  = '0° / 正x軸';
      document.getElementById('ax-top').textContent    = '90°';
      document.getElementById('ax-left').textContent   = '180°';
      document.getElementById('ax-bottom').textContent = '270°';
    } else {
      document.getElementById('ax-right').textContent  = '0 / 正x軸';
      renderAxLabel('ax-top',    '\\dfrac{\\pi}{2}');
      renderAxLabel('ax-left',   '\\pi');
      renderAxLabel('ax-bottom', '\\dfrac{3\\pi}{2}');
    }
  }

  function draw() {
    const gridColor = 'rgba(255,255,255,0.07)';
    const axisColor = 'rgba(255,255,255,0.30)';
    const teal = '#1D9E75', amber = '#EF9F27', blue = '#378ADD', WHITE = '#ffffff';

    const fs = SIZE / 600;
    const F_AXIS  = `600 ${Math.round(20*fs)}px 'Segoe UI','Noto Sans TC',sans-serif`;
    const F_SIGN  = `500 ${Math.round(18*fs)}px 'Segoe UI','Noto Sans TC',sans-serif`;
    const F_GREEK = `500 ${Math.round(36*fs)}px 'Segoe UI','Noto Sans TC',sans-serif`;

    ctx.clearRect(0, 0, SIZE, SIZE);

    // Grid circles
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.arc(CX, CY, R*i/3, 0, 2*Math.PI);
      ctx.strokeStyle = gridColor; ctx.lineWidth = 1; ctx.stroke();
    }

    // Spokes
    ctx.lineWidth = 0.7; ctx.strokeStyle = gridColor;
    for (let a = 0; a < 2*Math.PI; a += Math.PI/6) {
      ctx.beginPath(); ctx.moveTo(CX, CY);
      ctx.lineTo(CX + (R+18)*Math.cos(a), CY - (R+18)*Math.sin(a)); ctx.stroke();
    }

    // Main axes
    ctx.strokeStyle = axisColor; ctx.lineWidth = 1.8; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(CX-R-28, CY); ctx.lineTo(CX+R+28, CY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX, CY-R-28); ctx.lineTo(CX, CY+R+28); ctx.stroke();

    // Arrows
    ctx.fillStyle = axisColor;
    for (let [dx,dy] of [[R+28,0],[-R-28,0],[0,-R-28],[0,R+28]]) {
      const ang = Math.atan2(-dy, dx);
      ctx.save(); ctx.translate(CX+dx, CY+dy); ctx.rotate(-ang);
      ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-6,-4.5); ctx.lineTo(-6,4.5);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // Outer circle
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 2*Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5; ctx.stroke();

    // Axis direction labels drawn via HTML overlay (see updateAxisLabels)
    updateAxisLabels();

    // +/− signs
    ctx.font = F_SIGN; ctx.fillStyle = WHITE;
    ctx.fillText('+x', CX + R/2, CY - 16);
    ctx.fillText('−x', CX - R/2, CY - 16);
    ctx.fillText('+y', CX + 16,  CY - R/2);
    ctx.fillText('−y', CX + 16,  CY + R/2);

    const theta = getTheta();
    const px = CX + R * Math.cos(angleRad);
    const py = CY - R * Math.sin(angleRad);

    // Angle arc
    const arcR = R * 0.30;
    ctx.beginPath();
    ctx.arc(CX, CY, arcR, 0, -angleRad, angleRad >= 0);
    ctx.strokeStyle = amber; ctx.lineWidth = 2.5; ctx.stroke();

    // Arc arrowhead
    ctx.save();
    ctx.translate(CX + arcR*Math.cos(angleRad), CY - arcR*Math.sin(angleRad));
    ctx.rotate(-angleRad + (theta >= 0 ? Math.PI/2 : -Math.PI/2));
    ctx.fillStyle = amber;
    ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(-4,4); ctx.lineTo(4,4);
    ctx.closePath(); ctx.fill(); ctx.restore();

    // Radius line
    ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(px, py);
    ctx.strokeStyle = teal; ctx.lineWidth = 3; ctx.setLineDash([]); ctx.stroke();

    // Projection dashes
    ctx.setLineDash([6,5]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(55,138,221,0.5)';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, CY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(CX, py); ctx.stroke();
    ctx.setLineDash([]);

    // Projection dots
    ctx.fillStyle = blue;
    ctx.beginPath(); ctx.arc(px, CY, 5, 0, 2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(CX, py, 5, 0, 2*Math.PI); ctx.fill();

    // θ label
    ctx.font = F_GREEK; ctx.fillStyle = amber; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('θ', CX + (arcR+28)*Math.cos(angleRad/2), CY - (arcR+28)*Math.sin(angleRad/2));

    // r label
    ctx.fillStyle = teal; ctx.font = F_GREEK;
    const perpX = -Math.sin(angleRad) * 22, perpY = -Math.cos(angleRad) * 22;
    ctx.fillText('r', CX + (R/2)*Math.cos(angleRad) + perpX, CY - (R/2)*Math.sin(angleRad) + perpY);

    // Draggable point
    ctx.beginPath(); ctx.arc(px, py, 13, 0, 2*Math.PI); ctx.fillStyle = teal; ctx.fill();
    ctx.beginPath(); ctx.arc(px, py,  6, 0, 2*Math.PI); ctx.fillStyle = '#fff'; ctx.fill();

    // Center dot
    ctx.beginPath(); ctx.arc(CX, CY, 4, 0, 2*Math.PI); ctx.fillStyle = axisColor; ctx.fill();

    // Update UI
    const thetaDisplay = getTheta();
    const thetaDeg = Math.round(thetaDisplay * 180 / Math.PI * 10) / 10;
    const thetaRadVal = Math.round(thetaDisplay * 10000) / 10000;
    const inputEl = document.getElementById('input-theta');
    const isEditing = document.activeElement === inputEl;
    if (!isEditing) {
      const rawVal = showDeg ? String(thetaDeg) : radToFracStr(thetaDisplay);
      inputEl.value = rawVal;
      // render KaTeX preview
      inputEl.style.display = 'none';
      document.getElementById('theta-display').style.display = '';
      renderThetaDisplay(rawVal);
    }
    if (showDeg) {
      document.getElementById('sub-theta').textContent =
        (thetaDisplay >= 0 ? '正角（逆時針）' : '負角（順時針）') + '　度';
    } else {
      document.getElementById('sub-theta').textContent =
        `= ${thetaRadVal} rad`;
    }
    const [q, qs] = getQuadrant(angleRad);
    document.getElementById('val-quad').textContent = q;
    document.getElementById('sub-quad').textContent = qs;
    const rVal = getR();
    document.getElementById('val-r-display').textContent = rVal;
    if (showDeg) {
      document.getElementById('val-notation').textContent = `${Math.round(thetaDisplay * 180 / Math.PI * 10) / 10}°`;
    } else {
      // reuse fracToLatex so format is consistent: π/6, 2π/3, etc.
      const fracStr = radToFracStr(thetaDisplay);
      const latexTheta = fracToLatex(fracStr);
      try {
        katex.render(latexTheta, document.getElementById('val-notation'), { throwOnError: false, displayMode: false });
      } catch(e) {
        document.getElementById('val-notation').textContent = fracStr + 'π';
      }
    }
    // KaTeX cartesian
    const xExact = rVal * Math.cos(angleRad);
    const yExact = rVal * Math.sin(angleRad);
    renderKatexVal('val-x', xExact);
    renderKatexVal('val-y', yExact);
  }

  // Special-angle trig values: only exact fractions/surds for multiples of 15°
  function toLatexFrac(val) {
    const tol = 1e-6;
    if (Math.abs(val) < tol) return '0';

    const sign = val < 0 ? '-' : '';
    const abs  = Math.abs(val);

    // Known exact values: n/2, n*sqrt(2)/2, n*sqrt(3)/2, n*sqrt(6)/4 (multiples of r at special angles)
    // We check if abs matches p*sqrt(k)/q for small p,q and k in {1,2,3,6}
    const candidates = [
      { k: 1, sqrtK: 1 },
      { k: 2, sqrtK: Math.SQRT2 },
      { k: 3, sqrtK: Math.sqrt(3) },
      { k: 6, sqrtK: Math.sqrt(6) },
    ];
    const maxDen = 24; // keep denominators small — only true special-angle fractions

    for (const { k, sqrtK } of candidates) {
      const ratio = abs / sqrtK;          // should be p/q with small q
      for (let q = 1; q <= maxDen; q++) {
        const pRaw = ratio * q;
        const p    = Math.round(pRaw);
        if (p === 0) continue;
        if (Math.abs(pRaw - p) < tol) {
          const g  = gcd(p, q);
          const pS = p / g, qS = q / g;
          if (pS > 200 || qS > 24) continue;

          let num;
          if (k === 1)       num = `${pS}`;
          else if (pS === 1) num = `\\sqrt{${k}}`;
          else               num = `${pS}\\sqrt{${k}}`;

          const latex = qS === 1
            ? `${sign}${num}`
            : `${sign}\\dfrac{${num}}{${qS}}`;
          return latex;
        }
      }
    }

    // Not a special-angle value — return plain decimal (4 sig figs, strip trailing zeros)
    const dec = parseFloat(val.toPrecision(4));
    return `${dec}`;
  }

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a,b] = [b, a%b]; } return a; }

  function renderKatexVal(id, val) {
    const el = document.getElementById(id);
    const latex = toLatexFrac(val);
    try {
      katex.render(latex, el, { throwOnError: false, displayMode: false });
    } catch(e) {
      el.textContent = latex;
    }
  }

  // dummy so the block above closes properly (already closed)

  function ptToAngle(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = SIZE / rect.width, scaleY = SIZE / rect.height;
    let cx, cy;
    if (e.touches) { cx = (e.touches[0].clientX - rect.left)*scaleX; cy = (e.touches[0].clientY - rect.top)*scaleY; }
    else           { cx = (e.clientX - rect.left)*scaleX;             cy = (e.clientY - rect.top)*scaleY; }
    angleRad = Math.atan2(-(cy - CY), cx - CX);
    if (!showNeg) while (angleRad < 0) angleRad += 2*Math.PI;
  }

  canvas.addEventListener('mousedown',  e => { dragging = true; ptToAngle(e); draw(); });
  canvas.addEventListener('mousemove',  e => { if (dragging) { ptToAngle(e); draw(); } });
  canvas.addEventListener('mouseup',    () => dragging = false);
  canvas.addEventListener('mouseleave', () => dragging = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; ptToAngle(e); draw(); }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); if (dragging) { ptToAngle(e); draw(); } }, {passive:false});
  canvas.addEventListener('touchend',   () => dragging = false);

  function tryDraw() {
    if (typeof katex !== 'undefined') { draw(); }
    else { setTimeout(tryDraw, 50); }
  }
  tryDraw();
})();
</script>
</body>
</html>
